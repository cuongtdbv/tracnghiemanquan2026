<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trắc Nghiệm An Toàn 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .opt-btn { transition: all 0.2s; text-align: left; }
        .opt-btn:hover { background-color: #f1f5f9; border-color: #64748b; }
        .selected-opt { border-color: #2563eb !important; background-color: #eff6ff !important; color: #1e40af !important; }
        .correct-opt { background-color: #dcfce7 !important; border-color: #16a34a !important; color: #15803d !important; }
        .wrong-opt { background-color: #fee2e2 !important; border-color: #dc2626 !important; color: #b91c1c !important; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800 p-4 md:p-8">
    <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl p-6 md:p-8">
        
        <!-- Header -->
        <div class="text-center pb-6 mb-6 border-b border-slate-200">
            <h1 class="text-2xl md:text-3xl font-extrabold text-blue-900 flex items-center justify-center gap-2">
                <i class="fas fa-shield-alt text-blue-600"></i> ÔN TẬP TRẮC NGHIỆM AN TOÀN 2026
            </h1>
            <p class="text-slate-500 text-sm mt-1">Hệ thống ôn luyện chuẩn toàn bộ 285 câu hỏi thực tế</p>
        </div>

        <!-- Màn hình Setup -->
        <div id="view-setup">
            <div class="mb-6">
                <label class="block font-bold text-slate-700 mb-2">1. Chọn chế độ:</label>
                <div class="grid grid-cols-2 gap-4">
                    <button type="button" id="btn-prac" class="p-4 rounded-xl border-2 border-blue-600 bg-blue-50 font-bold text-blue-900 cursor-pointer shadow-sm">
                        <i class="fas fa-book-open mr-1"></i> Ôn Luyện (Xem đáp án ngay)
                    </button>
                    <button type="button" id="btn-exam" class="p-4 rounded-xl border-2 border-slate-200 bg-slate-50 font-bold text-slate-600 cursor-pointer shadow-sm">
                        <i class="fas fa-clock mr-1"></i> Thi Thử (Nộp bài mới xem kết quả)
                    </button>
                </div>
            </div>

            <div class="mb-8">
                <label class="block font-bold text-slate-700 mb-2">2. Số lượng câu hỏi:</label>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    <button type="button" id="cnt-10" class="py-3 px-4 rounded-xl border-2 border-blue-600 bg-blue-50 font-bold text-blue-700 cursor-pointer">10 câu</button>
                    <button type="button" id="cnt-20" class="py-3 px-4 rounded-xl border-2 border-slate-200 bg-slate-50 font-bold text-slate-700 cursor-pointer">20 câu</button>
                    <button type="button" id="cnt-50" class="py-3 px-4 rounded-xl border-2 border-slate-200 bg-slate-50 font-bold text-slate-700 cursor-pointer">50 câu</button>
                    <button type="button" id="cnt-all" class="py-3 px-4 rounded-xl border-2 border-slate-200 bg-slate-50 font-bold text-slate-700 cursor-pointer">Toàn bộ (285 câu)</button>
                </div>
            </div>

            <button type="button" id="btn-start" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg transition text-lg cursor-pointer">
                <i class="fas fa-play mr-2"></i> BẮT ĐẦU ÔN TẬP
            </button>
        </div>

        <!-- Màn hình Quiz -->
        <div id="view-quiz" class="hidden">
            <div class="flex justify-between items-center mb-6 text-sm font-semibold text-slate-500">
                <span>Câu <span id="lbl-curr" class="text-blue-600 font-bold text-lg">1</span> / <span id="lbl-total">10</span></span>
                <button type="button" id="btn-home" class="text-rose-600 hover:underline cursor-pointer"><i class="fas fa-sign-out-alt"></i> Thoát</button>
            </div>

            <h2 id="lbl-question" class="text-lg md:text-xl font-bold text-slate-800 mb-6 leading-relaxed"></h2>

            <div id="box-options" class="space-y-3 mb-6"></div>

            <div id="box-feedback" class="hidden p-4 rounded-xl mb-6 text-sm font-medium"></div>

            <div class="flex justify-between pt-4 border-t border-slate-200">
                <button type="button" id="btn-prev" class="px-5 py-2.5 rounded-xl border-2 border-slate-300 font-bold text-slate-700 hover:bg-slate-100 cursor-pointer">
                    <i class="fas fa-arrow-left mr-1"></i> Trước
                </button>
                <button type="button" id="btn-next" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow cursor-pointer">
                    Tiếp <i class="fas fa-arrow-right ml-1"></i>
                </button>
                <button type="button" id="btn-submit" class="hidden px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow cursor-pointer">
                    Nộp Bài <i class="fas fa-check ml-1"></i>
                </button>
            </div>
        </div>

        <!-- Màn hình Kết quả -->
        <div id="view-result" class="hidden text-center">
            <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-2xl mx-auto mb-4">
                <i class="fas fa-trophy"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-800 mb-2">Kết Quả Ôn Tập</h2>
            <div class="text-4xl font-extrabold text-blue-600 mb-2" id="res-score">0/0</div>
            <p class="text-slate-500 mb-6" id="res-percent">Tỷ lệ đúng: 0%</p>

            <div class="text-left mb-6 border-t pt-4 space-y-4 max-h-96 overflow-y-auto" id="res-list"></div>

            <button type="button" id="btn-restart" class="px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow cursor-pointer">
                <i class="fas fa-redo mr-2"></i> Làm Lại Đề Mới
            </button>
        </div>

    </div>

    <script>
        const allQuestions = [
            {"id": 1, "question": "Dây đeo an toàn phải được thử nghiệm định kỳ bao lâu 1 lần?", "options": ["3 tháng", "6 tháng", "12 tháng", "2 năm"], "correct": 1},
            {"id": 2, "question": "Trọng lượng thử đối với dây an toàn cũ là bao nhiêu?", "options": ["125", "155", "175", "225"], "correct": 3},
            {"id": 3, "question": "Trọng lượng thử đối với dây an toàn mới là bao nhiêu?", "options": ["200", "225", "250", "300"], "correct": 3},
            {"id": 4, "question": "Thời gian thử mang tải của dây đeo an toàn là bao lâu?", "options": ["1 phút", "2 phút", "3  phút", "5 phút"], "correct": 3},
            {"id": 5, "question": "Nếu xảy ra tai nạn do dây an toàn bị đứt, gẫy móc hoặc do không thử đúng kỳ hạn thì ai phải chịu hoàn toàn trách nhiệm?", "options": ["Người chỉ huy trực tiếp", "Đơn vị công tác", "Người sử dụng", "Người cho phép"], "correct": 1},
            {"id": 6, "question": "Quy định đối với việc sử dụng dây đeo an toàn là đúng?", "options": ["Hằng ngày, Nhân viên công tác trước khi làm việc trên cao phải tự kiểm tra dây đeo an toàn của mình bằng cách đeo vào người rồi buộc dây vào vật chắc chắn ở dưới đất và chụm chân lại ngả người ra phía sau xem dây có hiện tượng bất thường gì không", "Phải bảo quản tốt dây đeo an toàn, làm xong phải cuộn lại gọn gàng, không để chỗ ẩm thấp mà phải treo lên hoặc để chỗ cao, khô ráo, sạch sẽ.", "Sau khi thử dây đeo an toàn phải ghi ngày thử, trọng lượng thử và nhận xét tốt, xấu vào sổ theo dõi thử dây an toàn. Đồng thời đánh dấu (dán tem) vào dây đã thử còn đạt tiêu chuẩn, chỉ dây nào đánh dấu mới được sử dụng. Những dây đeo an toàn không sử dụng được phải được lập biên bản và hủy bỏ", "Tất cả đáp án trên"], "correct": 3},
            {"id": 7, "question": "Khi làm việc trong không gian hạn chế:", "options": ["Phải làm việc theo Phiếu công tác.", "Phải làm việc theo Lệnh công tác", "Làm việc theo Phiếu công tác hoặc Lệnh công tác tùy đơn vị quản lý vận hành cấp"], "correct": 0},
            {"id": 8, "question": "Những mối nguy nào có trong không gian hạn chế?", "options": ["Thiếu ôxy, xuất hiện khí độc, khói bụi", "Hóa chất độc hại, nguy cơ cháy nổ, thiếu ánh sáng", "Tiếng ồn vượt ngưỡng cho phép, bị chặn mất lối thoát.", "Tất cả đáp án trên"], "correct": 3},
            {"id": 9, "question": "Hàm lượng khí CO2 trong không gian kín tối đa cho phép là bao nhiêu mg/m³?", "options": ["9000", "12000", "16000", "18000"], "correct": 3},
            {"id": 10, "question": "Hàm lượng khí CO2 trong giới hạn tiếp xúc ca làm việc (TWA) là bao nhiêu mg/m³?", "options": ["9000", "12000", "16000", "18000"], "correct": 0},
            {"id": 11, "question": "Hàm lượng khí CO trong không gian kín tối đa cho phép là bao nhiêu mg/m³?", "options": ["10", "20", "30", "40"], "correct": 3},

            {"id": 13, "question": "Hàm lượng khí H₂S trong không gian kín tối đa cho phép là bao nhiêu mg/m³?", "options": ["10", "15", "20", "25"], "correct": 1},
            {"id": 14, "question": "Hàm lượng khí H₂S trong giới hạn tiếp xúc ca làm việc (TWA) là bao nhiêu mg/m³?", "options": ["10", "15", "20", "25"], "correct": 0},
            {"id": 15, "question": "Hàm lượng khí NH₃ trong không gian kín tối đa cho phép là bao nhiêu mg/m³?", "options": ["10", "15", "17", "25"], "correct": 3},
            {"id": 16, "question": "Hàm lượng khí NH₃ trong giới hạn tiếp xúc ca làm việc (TWA) là bao nhiêu mg/m³?", "options": ["10", "15", "17", "25"], "correct": 2},
            {"id": 17, "question": "Hàm lượng khí NO trong giới hạn tiếp xúc ca làm việc (TWA) là bao nhiêu mg/m³?", "options": ["10", "15", "20", "25"], "correct": 0},
            {"id": 18, "question": "Hàm lượng khí CH₄ trong không gian kín tối đa cho phép là bao nhiêu mg/m³?", "options": ["1", "2", "3", "4"], "correct": 1},
            {"id": 19, "question": "Hàm lượng khí O₂ trong không không khí chiếm theo thể tích là bao nhiêu?", "options": ["18,5% đến 19,5%", "18,5% đến 23,5%", "19,5% đến 23,5%", "19,5% đến 22,5%"], "correct": 2},
            {"id": 20, "question": "Hàm lượng của các loại khí dễ cháy trong không gian hạn chế phải ít hơn bao nhiêu % của giới hạn nổ dưới (Lower Explosive Limit) của khí dễ cháy.", "options": ["0.1", "0.15", "0.2", "0.25"], "correct": 0},
            {"id": 21, "question": "Tỷ lệ thành phần của H2 và không khí dễ gây cháy nổ là?", "options": ["Hỗn hợp H2 và không khí có chứa H2 từ 2,63% đến 95%", "Hỗn hợp H2 và không khí có chứa H2 từ 3,3% đến 81,5%", "Hỗn hợp H2 và không khí có chứa H2 từ 3,5% đến 85,1%", "Hỗn hợp H2 và không khí có chứa H2 từ 3,3% đến 85,5%"], "correct": 1},
            {"id": 22, "question": "Hỗn hợp H2 và O2 có chứa H2 bao nhiêu phần trăm thì dễ gây cháy nổ?", "options": ["Hỗn hợp H2 và O2 có chứa H2 từ 3,3% đến 81,5%", "Hỗn hợp H2 và O2 có chứa H2 từ 2,63% đến 95%", "Hỗn hợp H2 và O2 có chứa H2 từ 2,63% đến 33%", "Hỗn hợp H2 và O2 có chứa H2 từ 67% đến 33%"], "correct": 1},
            {"id": 23, "question": "Tỷ lệ thành phần của H2 và ôxy (O2) dễ gây cháy nổ là?", "options": ["Hỗn hợp gồm 3,3% H2 và 81,5% O2.", "Hỗn hợp gồm 2,63% H2 và 95% O2.", "Hỗn hợp gồm 76% H2 và 63% O2.", "Hỗn hợp gồm 67% H2 và 33% O2."], "correct": 3},
            {"id": 24, "question": "Nước nhiễm dầu có được thải ra mương thoát nước không?", "options": ["Có", "Không"], "correct": 1},
            {"id": 25, "question": "Anh/chị hãy giải thích thế nào là Làm việc có cắt điện một phần?", "options": ["Là công việc trên các thiết bị điện đã cắt điện hoàn toàn, các lối đi đã đóng cửa hoàn toàn", "Là công việc làm ở thiết bị đang mang điện, có sử dụng các trang bị, dụng cụ chuyên dùng", "Là làm công việc tại trạm biến áp 220 kV.", "Là công việc làm ở thiết bị chỉ có một phần được cắt điện để làm việc hoặc thiết bị được cắt điện hoàn toàn nhưng các lối đi ra phần phân phối ngoài trời hoặc thông sang phòng bên cạnh có điện vẫn mở cửa"], "correct": 3},
            {"id": 26, "question": "Anh/chị hãy giải thích thế nào là Điện hạ áp?", "options": ["Là điện áp dưới 1000 V", "Là điện áp trên 1000 V", "Là điện áp
