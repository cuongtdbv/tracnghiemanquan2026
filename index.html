<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trắc Nghiệm An Toàn 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .opt-btn { transition: all 0.2s; text-align: left; }
        .opt-btn:hover { background-color: #f1f5f9; border-color: #64748b; }
        .selected-opt { border-color: #2563eb !important; background-color: #eff6ff !important; color: #1e40af !important; }
        .correct-opt { background-color: #dcfce7 !important; border-color: #16a34a !important; color: #15803d !important; }
        .wrong-opt { background-color: #fee2e2 !important; border-color: #dc2626 !important; color: #b91c1c !important; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800 p-4 md:p-8">
    <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl p-6 md:p-8">
        
        <!-- Header -->
        <div class="text-center pb-6 mb-6 border-b border-slate-200">
            <h1 class="text-2xl md:text-3xl font-extrabold text-blue-900 flex items-center justify-center gap-2">
                <i class="fas fa-shield-alt text-blue-600"></i> ÔN TẬP TRẮC NGHIỆM AN TOÀN 2026
            </h1>
            <p class="text-slate-500 text-sm mt-1">Hệ thống ôn luyện chuẩn 285 câu hỏi từ Ngân hàng Excel</p>
        </div>

        <!-- Màn hình Setup -->
        <div id="view-setup">
            <div class="mb-6">
                <label class="block font-bold text-slate-700 mb-2">1. Chọn chế độ:</label>
                <div class="grid grid-cols-2 gap-4">
                    <button type="button" id="btn-prac" onclick="setMode('practice')" class="p-4 rounded-xl border-2 border-blue-600 bg-blue-50 font-bold text-blue-900 cursor-pointer shadow-sm">
                        <i class="fas fa-book-open mr-1"></i> Ôn Luyện (Xem đáp án ngay)
                    </button>
                    <button type="button" id="btn-exam" onclick="setMode('exam')" class="p-4 rounded-xl border-2 border-slate-200 bg-slate-50 font-bold text-slate-600 cursor-pointer shadow-sm">
                        <i class="fas fa-clock mr-1"></i> Thi Thử (Nộp bài mới xem kết quả)
                    </button>
                </div>
            </div>

            <div class="mb-8">
                <label class="block font-bold text-slate-700 mb-2">2. Số lượng câu hỏi:</label>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    <button type="button" id="cnt-10" onclick="setCount(10)" class="py-3 px-4 rounded-xl border-2 border-blue-600 bg-blue-50 font-bold text-blue-700 cursor-pointer">10 câu</button>
                    <button type="button" id="cnt-20" onclick="setCount(20)" class="py-3 px-4 rounded-xl border-2 border-slate-200 bg-slate-50 font-bold text-slate-700 cursor-pointer">20 câu</button>
                    <button type="button" id="cnt-50" onclick="setCount(50)" class="py-3 px-4 rounded-xl border-2 border-slate-200 bg-slate-50 font-bold text-slate-700 cursor-pointer">50 câu</button>
                    <button type="button" id="cnt-all" onclick="setCount('all')" class="py-3 px-4 rounded-xl border-2 border-slate-200 bg-slate-50 font-bold text-slate-700 cursor-pointer">Toàn bộ (285 câu)</button>
                </div>
            </div>

            <button type="button" onclick="startQuiz()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg transition text-lg cursor-pointer">
                <i class="fas fa-play mr-2"></i> BẮT ĐẦU ÔN TẬP
            </button>
        </div>

        <!-- Màn hình Quiz -->
        <div id="view-quiz" class="hidden">
            <div class="flex justify-between items-center mb-6 text-sm font-semibold text-slate-500">
                <span>Câu <span id="lbl-curr" class="text-blue-600 font-bold text-lg">1</span> / <span id="lbl-total">10</span></span>
                <button type="button" onclick="goHome()" class="text-rose-600 hover:underline cursor-pointer"><i class="fas fa-sign-out-alt"></i> Thoát</button>
            </div>

            <h2 id="lbl-question" class="text-lg md:text-xl font-bold text-slate-800 mb-6 leading-relaxed"></h2>

            <div id="box-options" class="space-y-3 mb-6"></div>

            <div id="box-feedback" class="hidden p-4 rounded-xl mb-6 text-sm font-medium"></div>

            <div class="flex justify-between pt-4 border-t border-slate-200">
                <button type="button" id="btn-prev" onclick="moveQ(-1)" class="px-5 py-2.5 rounded-xl border-2 border-slate-300 font-bold text-slate-700 hover:bg-slate-100 cursor-pointer">
                    <i class="fas fa-arrow-left mr-1"></i> Trước
                </button>
                <button type="button" id="btn-next" onclick="moveQ(1)" class="px-6 py-2.5 bg-blue-
